<div class="auth-page">
  <div class="card auth-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-mark mx-auto mb-3" style="width:48px;height:48px;font-size:1rem;">HP</span>
        <h1 class="h5 mb-1 mt-3">HMCF Prime Operations</h1>
        <p class="text-muted small mb-0">Staff login</p>
      </div>

      <div class="alert alert-danger py-2 small" ng-if="vm.error">{{ vm.error }}</div>

      <form name="loginForm" ng-submit="vm.submit()" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" class="form-control" ng-model="vm.username" required autofocus autocomplete="username">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" ng-model="vm.password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100" ng-disabled="loginForm.$invalid || vm.loading">
          {{ vm.loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        <a href="#!/forgot-password">Forgot your password?</a>
      </p>
    </div>
  </div>
</div>
