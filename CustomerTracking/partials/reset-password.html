<div class="auth-page">
  <div class="card auth-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="h5 mb-1">Reset Password</h1>
        <p class="text-muted small mb-0">Choose a new password for your account</p>
      </div>

      <div class="alert alert-success py-2 small" ng-if="vm.success">
        Your password has been reset. <a href="#!/login">Log in</a> with your new password.
      </div>
      <div class="alert alert-danger py-2 small" ng-if="vm.error">{{ vm.error }}</div>

      <form name="resetForm" ng-submit="vm.submit()" novalidate ng-if="!vm.success && vm.token">
        <div class="mb-3">
          <label class="form-label small fw-semibold">New Password</label>
          <input type="password" class="form-control" ng-model="vm.password" required minlength="6" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Confirm New Password</label>
          <input type="password" class="form-control" ng-model="vm.confirmPassword" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100" ng-disabled="resetForm.$invalid || vm.loading">
          {{ vm.loading ? 'Saving...' : 'Reset Password' }}
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        <a href="#!/login">Back to login</a>
      </p>
    </div>
  </div>
</div>
