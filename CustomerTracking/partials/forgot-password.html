<div class="auth-page">
  <div class="card auth-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h1 class="h5 mb-1">Forgot Password</h1>
        <p class="text-muted small mb-0">Enter your username or email and we'll send a reset link</p>
      </div>

      <div class="alert alert-success py-2 small" ng-if="vm.submitted">{{ vm.message }}</div>
      <div class="alert alert-danger py-2 small" ng-if="vm.error">{{ vm.error }}</div>

      <form name="forgotForm" ng-submit="vm.submit()" novalidate ng-if="!vm.submitted">
        <div class="mb-4">
          <label class="form-label small fw-semibold">Username or Email</label>
          <input type="text" class="form-control" ng-model="vm.identifier" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100" ng-disabled="forgotForm.$invalid || vm.loading">
          {{ vm.loading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        <a href="#!/login">Back to login</a>
      </p>
    </div>
  </div>
</div>
